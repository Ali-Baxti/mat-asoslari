name: C++ CI and Windows Desktop Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_QT_GUI=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark
        run: ./build/prime_benchmark
      - name: Upload benchmark CSV
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_results.csv
          if-no-files-found: error

  windows:
    name: Windows / Qt 6 Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DBUILD_QT_GUI=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/prime_checker_gui.exe package/
          Copy-Item build/Release/prime_checker.exe package/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/prime_benchmark.exe package/ -ErrorAction SilentlyContinue
          windeployqt --release --compiler-runtime package/prime_checker_gui.exe
          @'
          Tub Sonlarni Tekshirish — Windows dasturi
          Ishga tushirish: prime_checker_gui.exe
          Konsol versiyasi: prime_checker.exe
          '@ | Set-Content package/README.txt -Encoding UTF8

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: tub-sonlar-windows-x64
          path: package/
          if-no-files-found: error
